<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="640" height="500"><style>
.gift-lid {
  transform-origin: 13px 49px;
  animation: gift-open 4.8s ease-in-out infinite;
}

@keyframes gift-open {
  0%, 18%, 78%, 100% { transform: rotate(0); }
  40%, 54% { transform: rotate(-9deg); }
}

.envelope-letter {
  animation: help-letter-rise 4.8s ease-in-out infinite;
}

@keyframes help-letter-rise {
  0%, 46%, 92%, 100% { transform: translateY(0); }
  63%, 75% { transform: translateY(-8px); }
}

.help-star {
  animation: help-twinkle 4.8s ease-in-out infinite;
}

.help-star + .help-star {
  animation-delay: -2.4s;
}

@keyframes help-twinkle {
  0%, 100% { opacity: .72; }
  50% { opacity: 1; }
}
</style><defs><symbol id="help" viewBox="0 0 360 220">
