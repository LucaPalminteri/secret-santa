  <use href="#gift" x="53" y="86" width="88" height="97"/>
  <use href="#envelope" x="154" y="84" width="142" height="102"/>
  <use class="help-star" href="#star" x="128" y="40" width="20" height="20"/>
  <use class="help-star" href="#star" x="275" y="53" width="14" height="14"/>
</symbol><symbol id="gift" viewBox="0 0 100 110">
          <g stroke="#243D32" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
